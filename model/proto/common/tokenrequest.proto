  // locality_token is presented on refresh by workloads to prove they can
  // still reach their parent. Kernel validates against the parent's
  // registered WorkloadLocality in WorkloadState.
  string locality_token = 7;
  string trace_id = 200;
  bool noop = 201;
}

// MintUserTokenRequest is the input for MintUserToken (C2S delegation).
// A broker (e.g. oauth) authenticates via its service token in the header
// and requests a token on behalf of a user it has already verified.
// Kernel calls OPA to resolve the user's claims into expanded
// per-service RPC entitlements — the broker does not determine authorization.

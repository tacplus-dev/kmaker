  string subject = 1;

  // claims are the IDP claims forwarded by the broker (e.g. email, groups,
  // roles from Google/Okta/Azure AD). Kernel forwards these to OPA
  // for entitlement resolution (returns TokenEntitlements).
  // Standard JWT claims (sub, iss, aud, exp, iat, jti) are set by kernel
  // and must not appear here.
  google.protobuf.Struct claims = 2;

  // exp is the desired expiry epoch (0 = use default, capped by server policy).
  int64 exp = 3;

  // offline_access requests an Offline Token (OT) — long-lived, identity-only —
  // returned in the response refresh_token slot. The broker sets this when the
  // user requested offline access (e.g. OAuth scope=offline_access). When false,
  // the refresh_token slot carries a normal (browser) refresh token.
  bool offline_access = 4;
  string trace_id = 200;
  bool noop = 201;
}


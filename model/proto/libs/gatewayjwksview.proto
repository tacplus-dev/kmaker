// ============================================================================
// This file defines the cross-boundary Gateway JWKS view service.
// The gateway subscribes to this service to serve its public /.well-known/jwks.json.
// The cluster automatically implements this service by aggregating all
// collections annotated with (spec.view_member) = "GatewayJwksView".
//
// Distinct from JwkVerifyingKeysView (libs/jwkview.proto): that view is the
// INTERNAL token-verification set (read by every service's authorizer); this
// view is the PUBLIC JWKS set (read only by the gateway) and additionally
// includes externally-facing signing keys (e.g. the ES256 key used for WIF
// assertion tokens) that internal verifiers do not need.
// ============================================================================

syntax = "proto3";

package gatewayjwksview;
option go_package = "gitlab.com/secondstarcavalier/schematic/platform/services/kmaker/model/types/libs/gatewayjwksview";

import "libs/jwk.proto";
import "libs/spec.proto";
import "libs/trace.proto";

// GatewayJwksViewService provides a read-only aggregated view of all public
// JWKs the gateway should publish, across all state services that registered
// via (spec.view_member) = "GatewayJwksView".
//
// This service is automatically implemented by the cluster. The gateway
// subscribes to it to serve /.well-known/jwks.json.
service GatewayJwksViewService {
  rpc Watch(trace.TraceRequest) returns (stream GatewayJwksViewResponse);
  rpc Get(GatewayJwksViewGetRequest) returns (GatewayJwksViewGetResponse);
}

message GatewayJwksViewResponse {
  map<string, jwk.Jwk> entries = 1;  // kid -> Jwk
}

message GatewayJwksViewGetRequest {
  string kid = 1;
}

message GatewayJwksViewGetResponse {
  jwk.Jwk value = 1;
  bool found = 2;
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_GATEWAY_JWKS_VIEW_RESPONSE = 1;
  TYPE_ID_GATEWAY_JWKS_VIEW_GET_REQUEST = 2;
  TYPE_ID_GATEWAY_JWKS_VIEW_GET_RESPONSE = 3;
}

enum GatewayJwksViewServiceRpcId {
  GATEWAY_JWKS_VIEW_SERVICE_RPC_ID_UNSPECIFIED = 0;
  GATEWAY_JWKS_VIEW_SERVICE_RPC_ID_ALL_ACCESSORS = 1;
  GATEWAY_JWKS_VIEW_SERVICE_RPC_ID_ALL_MUTATORS = 2;
  GATEWAY_JWKS_VIEW_SERVICE_RPC_ID_ALL_EXECUTORS = 3;
  GATEWAY_JWKS_VIEW_SERVICE_RPC_ID_WATCH = 4;
  GATEWAY_JWKS_VIEW_SERVICE_RPC_ID_GET = 5;
}

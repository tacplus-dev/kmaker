// Graph API message types
//
// Adapted from github.com/dgraph-io/dgo api.proto (Apache-2.0).
// Embedded in tacplus so that all languages get typed message definitions
// for constructing DQL queries and mutations.
//
// This file provides MESSAGE TYPES ONLY — no gRPC service definition.
// The query service is generated from spec.graph_type annotations, not
// from any store's native API. See ARCHITECTURE.md.
//
// Original: SPDX-FileCopyrightText: (c) 2017-2025 Istari Digital, Inc.
// Original: SPDX-License-Identifier: Apache-2.0
//
// Nested enums moved to top-level for tacplus generator compatibility.
// Wire format is unchanged (protobuf enum encoding depends only on field/value numbers).

syntax = "proto3";

package graph_api;
option go_package = "gitlab.com/secondstarcavalier/schematic/platform/services/kmaker/model/types/libs/graph_api";

// RespFormat controls the response encoding for queries.
enum RespFormat {
  JSON = 0;
  RDF = 1;
}

// DropOp specifies the type of schema drop operation.
enum DropOp {
  NONE = 0;
  DROP_ALL = 1;
  DROP_DATA = 2;
  DROP_ATTR = 3;
  DROP_TYPE = 4;
}

// FacetValType specifies the data type of a facet value.
enum FacetValType {
  FACET_VAL_STRING = 0;
  FACET_VAL_INT = 1;
  FACET_VAL_FLOAT = 2;
  FACET_VAL_BOOL = 3;
  FACET_VAL_DATETIME = 4;
}

message Request {
  uint64 start_ts = 1;

  string query = 4;
  map<string, string> vars = 5;
  bool read_only = 6;
  bool best_effort = 7;

  repeated Mutation mutations = 12;
  bool commit_now = 13;

  RespFormat resp_format = 14;
  string hash = 15;
}

message Uids {
  repeated string uids = 1;
}

message ListOfString {
  repeated string value = 1;
}

message Response {
  bytes json = 1;
  TxnContext txn = 2;
  Latency latency = 3;
  Metrics metrics = 4;
  // uids contains a mapping of blank_node => uid for the node.
  map<string, string> uids = 12;
  bytes rdf = 13;
  map<string, ListOfString> hdrs = 14;
}

message Mutation {
  bytes set_json = 1;
  bytes delete_json = 2;
  bytes set_nquads = 3;
  bytes del_nquads = 4;
  repeated NQuad set = 5;
  repeated NQuad del = 6;

  // Condition for upsert blocks.
  string cond = 9;

  // Convenience duplicate of Request.commit_now.
  bool commit_now = 14;
}

message Operation {
  string schema = 1;
  string drop_attr = 2;
  bool drop_all = 3;

  DropOp drop_op = 4;

  // If drop_op is DROP_ATTR or DROP_TYPE, drop_value holds the name of the
  // predicate or type to delete.
  string drop_value = 5;

  // Run indexes in background.
  bool run_in_background = 6;
}

message Payload {
  bytes Data = 1;
}

message TxnContext {
  uint64 start_ts = 1;
  uint64 commit_ts = 2;
  bool aborted = 3;
  repeated string keys = 4;
  repeated string preds = 5;
  string hash = 6;
}

message Check {}

message Version {
  string tag = 1;
}

message Latency {
  uint64 parsing_ns = 1;
  uint64 processing_ns = 2;
  uint64 encoding_ns = 3;
  uint64 assign_timestamp_ns = 4;
  uint64 total_ns = 5;
}

message Metrics {
  map<string, uint64> num_uids = 1;
}

message NQuad {
  string subject = 1;
  string predicate = 2;
  string object_id = 3;
  Value object_value = 4;
  string lang = 6;
  repeated Facet facets = 7;
  uint64 namespace = 8;
}

message Value {
  oneof val {
    string default_val = 1;
    bytes bytes_val = 2;
    int64 int_val = 3;
    bool bool_val = 4;
    string str_val = 5;
    double double_val = 6;
    bytes geo_val = 7;
    bytes date_val = 8;
    bytes datetime_val = 9;
    string password_val = 10;
    uint64 uid_val = 11;
    bytes bigfloat_val = 12;
    bytes vfloat32_val = 13;
  }
}

message Facet {
  string key = 1;
  bytes value = 2;
  FacetValType val_type = 3;
  repeated string tokens = 4;
  string alias = 5;
}

message LoginRequest {
  string userid = 1;
  string password = 2;
  string refresh_token = 3;
  uint64 namespace = 4;
}

message Jwt {
  string access_jwt = 1;
  string refresh_jwt = 2;
}

message RunDQLRequest {
  string dql_query = 1;
  map<string, string> vars = 2;
  bool read_only = 3;
  bool best_effort = 4;
  RespFormat resp_format = 5;
}

enum LeaseType {
  NS = 0;
  UID = 1;
  TS = 2;
}

message AllocateIDsRequest {
  uint64 how_many = 1;
  LeaseType lease_type = 2;
}

message AllocateIDsResponse {
  uint64 start = 1;
  uint64 end = 2;
}

message CreateNamespaceRequest {}

message CreateNamespaceResponse {
  uint64 namespace = 1;
}

message DropNamespaceRequest {
  uint64 namespace = 1;
}

message DropNamespaceResponse {}

message ListNamespacesRequest {}

message ListNamespacesResponse {
  map<uint64, Namespace> namespaces = 1;
}

message Namespace {
  uint64 id = 1;
}

message UpdateExtSnapshotStreamingStateRequest {
  bool start = 1;
  bool finish = 2;
  bool drop_data = 3;
}

message UpdateExtSnapshotStreamingStateResponse {
  repeated uint32 groups = 1;
}

message StreamExtSnapshotRequest {
  uint32 group_id = 1;
  bool forward = 2;
  StreamPacket pkt = 3;
}

message StreamExtSnapshotResponse {
  bool finish = 1;
}

message StreamPacket {
  bytes data = 1;
  bool done = 2;
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_REQUEST = 1;
  TYPE_ID_UIDS = 2;
  TYPE_ID_LIST_OF_STRING = 3;
  TYPE_ID_RESPONSE = 4;
  TYPE_ID_MUTATION = 5;
  TYPE_ID_OPERATION = 6;
  TYPE_ID_PAYLOAD = 7;
  TYPE_ID_TXN_CONTEXT = 8;
  TYPE_ID_CHECK = 9;
  TYPE_ID_VERSION = 10;
  TYPE_ID_LATENCY = 11;
  TYPE_ID_METRICS = 12;
  TYPE_ID_N_QUAD = 13;
  TYPE_ID_VALUE = 14;
  TYPE_ID_FACET = 15;
  TYPE_ID_LOGIN_REQUEST = 16;
  TYPE_ID_JWT = 17;
  TYPE_ID_RUN_DQL_REQUEST = 18;
  TYPE_ID_ALLOCATE_I_DS_REQUEST = 19;
  TYPE_ID_ALLOCATE_I_DS_RESPONSE = 20;
  TYPE_ID_CREATE_NAMESPACE_REQUEST = 21;
  TYPE_ID_CREATE_NAMESPACE_RESPONSE = 22;
  TYPE_ID_DROP_NAMESPACE_REQUEST = 23;
  TYPE_ID_DROP_NAMESPACE_RESPONSE = 24;
  TYPE_ID_LIST_NAMESPACES_REQUEST = 25;
  TYPE_ID_LIST_NAMESPACES_RESPONSE = 26;
  TYPE_ID_NAMESPACE = 27;
  TYPE_ID_UPDATE_EXT_SNAPSHOT_STREAMING_STATE_REQUEST = 28;
  TYPE_ID_UPDATE_EXT_SNAPSHOT_STREAMING_STATE_RESPONSE = 29;
  TYPE_ID_STREAM_EXT_SNAPSHOT_REQUEST = 30;
  TYPE_ID_STREAM_EXT_SNAPSHOT_RESPONSE = 31;
  TYPE_ID_STREAM_PACKET = 32;
}

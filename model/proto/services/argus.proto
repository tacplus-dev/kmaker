// ============================================================================
// Argus service
// ============================================================================

service Argus {

  // --- Structured operator queries ---

  // GetDashboard returns a real-time overview of all coding-agent activity.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);

  // ListActiveSessions returns all currently active sessions, paginated.
  rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse) {
  }

  // GetSessionDetail returns the summary and recent events for one session.
  rpc GetSessionDetail(GetSessionDetailRequest) returns (GetSessionDetailResponse);

  // GetUserActivity returns recent sessions and aggregate stats for one user.
  rpc GetUserActivity(GetUserActivityRequest) returns (GetUserActivityResponse);

  // ListSessionSearchResults searches sessions by keyword or SQL fragment.
  rpc ListSessionSearchResults(SearchSessionsRequest) returns (SearchSessionsResponse) {
  }

  // SubscribeLiveSessions streams real-time session lifecycle events.
  rpc SubscribeLiveSessions(agentsensor.WatchLiveSessionsRequest) returns (stream agentsensor.WatchLiveSessionsEvent);

  // --- Scratchpad ---

  // GetScratchpad retrieves a persistent note by key.
  rpc GetScratchpad(ScratchpadReadRequest) returns (ScratchpadReadResponse);

  // UpdateScratchpad stores or overwrites a persistent note.
  rpc UpdateScratchpad(ScratchpadWriteRequest) returns (ScratchpadWriteResponse);

  // DeleteScratchpad removes a persistent note by key.
  rpc DeleteScratchpad(ScratchpadDeleteRequest) returns (ScratchpadDeleteResponse);

  // ListScratchpads lists all stored note keys with metadata.
  rpc ListScratchpads(ScratchpadListRequest) returns (ScratchpadListResponse) {
  }

  // DeleteScratchpads removes all stored notes.
  rpc DeleteScratchpads(ScratchpadClearRequest) returns (ScratchpadClearResponse);

  // --- Supervisor context ---

  // GetSupervisorContext returns the formatted context block injected before
  // every Supervisor LLM invocation.
  rpc GetSupervisorContext(GetSupervisorContextRequest) returns (GetSupervisorContextResponse);

  // --- Watch RPCs (server-streaming, push on change) ---

  // SubscribeDashboard streams dashboard snapshots, pushed every ~2s as session state changes.
  rpc SubscribeDashboard(WatchDashboardRequest) returns (stream GetDashboardResponse);

  // SubscribeSessionDetail streams updates for one session as new events arrive.
  rpc SubscribeSessionDetail(WatchSessionDetailRequest) returns (stream GetSessionDetailResponse);

  // SubscribeUserActivity streams updated activity stats for one user as sessions evolve.
  rpc SubscribeUserActivity(WatchUserActivityRequest) returns (stream GetUserActivityResponse);

  // SubscribeSupervisorContext streams updated context blocks when the scratchpad or sessions change.
  rpc SubscribeSupervisorContext(WatchSupervisorContextRequest) returns (stream GetSupervisorContextResponse);

  // SubscribeScratchpadList streams the key listing whenever an entry is added, updated, or removed.
  rpc SubscribeScratchpadList(WatchScratchpadListRequest) returns (stream ScratchpadListResponse);

  // SubscribeScratchpadRead streams the value for a key whenever it is written.
  rpc SubscribeScratchpadRead(WatchScratchpadReadRequest) returns (stream ScratchpadReadResponse);

  // --- User listing and profiles ---

  // ListUsers returns all distinct users with aggregate stats over the given time range.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
  }

  // GetUserProfile returns rich per-user stats: tools, models, session duration, working dirs.
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);

  // GetUserTokenStats returns prompt volume and length distribution for one user over time.
  rpc GetUserTokenStats(GetUserTokenStatsRequest) returns (GetUserTokenStatsResponse);

  // SubscribeUserProfile streams updated profile snapshots as sessions evolve.
  rpc SubscribeUserProfile(WatchUserProfileRequest) returns (stream GetUserProfileResponse);

  // --- Commit and file activity ---

  // ListUserCommitActivity returns git commit events extracted from the user's Bash tool uses.
  rpc ListUserCommitActivity(GetUserCommitActivityRequest) returns (GetUserCommitActivityResponse) {
  }

  // ListFileActivity returns file create/modify/delete records across sessions.
  rpc ListFileActivity(GetFileActivityRequest) returns (GetFileActivityResponse) {
  }

  // --- Session and agent topology ---

  // ListSessionTimeline returns the full paginated event stream for one session.
  rpc ListSessionTimeline(GetSessionTimelineRequest) returns (GetSessionTimelineResponse) {
  }

  // GetAgentTree returns the subagent hierarchy for a session as a recursive tree.
  rpc GetAgentTree(GetAgentTreeRequest) returns (GetAgentTreeResponse);

  // --- Fleet analytics ---

  // GetSystemStats returns fleet-wide aggregates (users, sessions, events, tool stats).
  rpc GetSystemStats(GetSystemStatsRequest) returns (GetSystemStatsResponse);

  // ListToolLeaderboard returns tools ranked by use count with failure rates and latencies.
  rpc ListToolLeaderboard(GetToolLeaderboardRequest) returns (GetToolLeaderboardResponse) {
  }

  // ListModelUsage returns LLM model distribution across sessions.
  rpc ListModelUsage(GetModelUsageRequest) returns (GetModelUsageResponse) {
  }

  // ListActivityTimeseries returns bucketed event/session/user counts over a time range.
  rpc ListActivityTimeseries(GetActivityTimeseriesRequest) returns (GetActivityTimeseriesResponse) {
  }

  // SubscribeSystemStats streams fleet-wide stat snapshots every ~5s.
  rpc SubscribeSystemStats(WatchSystemStatsRequest) returns (stream GetSystemStatsResponse);

  // SubscribeToolLeaderboard streams updated leaderboard snapshots.
  rpc SubscribeToolLeaderboard(WatchToolLeaderboardRequest) returns (stream GetToolLeaderboardResponse);

  // --- Search ---

  // ListEventSearchResults finds events matching a filter across the hot store.
  rpc ListEventSearchResults(SearchEventsRequest) returns (SearchEventsResponse) {
  }

  // ListFilePathMatches finds all events that touched a given file path (prefix or glob).
  rpc ListFilePathMatches(SearchByFilePathRequest) returns (SearchByFilePathResponse) {

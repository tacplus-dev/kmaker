// Package oauth provides protobuf definitions for the OAuth service.
//
// OAuth is the unified authentication and token broker. It handles:
//   - OAuth2/OIDC browser flows (provider discovery, authorization code + PKCE,
//     IDP token verification, kernel token minting delegation)
//   - CLI/device token brokering via bidirectional streaming
//
// Browser auth flow:
//
//   1. User hits a microservice (e.g. sentinel). The gRPC server checks
//      for a valid bearer token. If absent/invalid, redirects to OAuth
//      with a callback_url query parameter.
//
//   2. OAuth's webapp shows provider selection. User picks an IDP.
//      OAuth redirects to the IDP with PKCE, state, and nonce.
//
//   3. IDP authenticates the user and redirects back to OAuth's callback.
//      OAuth exchanges the authorization code for an ID token, validates
//      it against the IDP's JWKS, then calls kernel's MintUserToken RPC to
//      get refresh and access tokens signed by kernel.
//
//   4. OAuth installs both tokens in the user's browser (cookies) and
//      redirects back to the original callback_url.
//
// CLI auth flow:
//
//   1. schematicctl generates a session ID, opens a bidi stream to OAuth,
//      and launches the browser to the OAuth login URL with the session ID.
//
//   2. The session ID is encrypted into the OAuth state parameter alongside
//      PKCE and callback data. The user completes OAuth in the browser.
//
//   3. On callback, OAuth decodes the state, recovers the session ID, mints
//      a token via kernel, and writes it to OAuthState (kernel-hosted shared
//      state). The OAuth pod holding the bidi stream watches OAuthState and
//      delivers the token to schematicctl.
//
// This design is stateless across OAuth pods — any pod can handle the
// callback, and any pod can deliver the token via the shared kernel state.
//
// OAuth has no signing keys — kernel is the sole token authority.


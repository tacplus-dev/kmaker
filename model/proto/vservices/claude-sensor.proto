// ============================================================================
// StratumQuery — S2S operator and analytics query surface, hosted by stratum
// ============================================================================

service StratumQuery {

  // --- Map lifecycle ---

  // CreateMap creates a new empty named working-set map. Error if name already in use.
  rpc CreateMap(CreateMapRequest) returns (CreateMapResponse);

  // DeleteMap destroys a working-set map and frees its memory.
  rpc DeleteMap(DeleteMapRequest) returns (DeleteMapResponse);

  // ListMaps returns all open working-set maps with basic metadata.
  rpc ListMaps(ListMapsRequest) returns (ListMapsResponse) {
  }

  // GetMapDetail returns a detailed breakdown (event types, time range, top actors).
  rpc GetMapDetail(GetMapDetailRequest) returns (GetMapDetailResponse);

  // GetMapSize returns event count and memory for a quick size check.
  rpc GetMapSize(MapSizeRequest) returns (MapSizeResponse);

  // --- Loading (all additive) ---

  // UpdateMapByIds loads specific events by event_id directly from the hot store.
  rpc UpdateMapByIds(UpdateMapByIdsRequest) returns (UpdateMapByIdsResponse);

  // UpdateMapBySql executes Calcite SQL against the hot event store and adds matches.
  rpc UpdateMapBySql(UpdateMapBySqlRequest) returns (UpdateMapBySqlResponse);

  // UpdateMapByTimedb queries TimeDB (ClickHouse) for event_ids, then hydrates from the hot store.
  rpc UpdateMapByTimedb(UpdateMapByTimedbRequest) returns (UpdateMapByTimedbResponse);

  // UpdateMapByGraphdb queries Dgraph for IDs, then hydrates full events from the hot store.
  rpc UpdateMapByGraphdb(UpdateMapByGraphdbRequest) returns (UpdateMapByGraphdbResponse);

  // --- Map mutation ---

  // UpdateMapFilter keeps only events matching the SQL predicate; removes all others.
  rpc UpdateMapFilter(UpdateMapFilterRequest) returns (UpdateMapFilterResponse);

  // Merge adds all events from src_map into dest_map. src_map is unchanged.
  rpc Merge(MergeRequest) returns (MergeResponse);

  // --- Read-only query ---

  // ExecuteMapQuery executes Calcite SQL over a working-set map and returns JSON rows.
  rpc ExecuteMapQuery(ExecuteMapQueryRequest) returns (ExecuteMapQueryResponse);

  // --- Operator queries ---

  // ListActiveSessions returns all sessions active within active_session_idle_seconds, paginated.
  rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse) {
  }

  // GetSessionEvents returns all SensorEvents for a session, paginated.
  rpc GetSessionEvents(GetSessionEventsRequest) returns (GetSessionEventsResponse);

  // GetUserSessions returns all sessions for a user email, paginated.
  rpc GetUserSessions(GetUserSessionsRequest) returns (GetUserSessionsResponse);

  // ListEventsByTimeRange returns all SensorEvents in a time window, paginated.
  rpc ListEventsByTimeRange(ListEventsByTimeRangeRequest) returns (ListEventsByTimeRangeResponse) {
  }

  // ListEventsByEmail returns all SensorEvents for a user email, paginated.
  rpc ListEventsByEmail(ListEventsByEmailRequest) returns (ListEventsByEmailResponse) {
  }

  // SubscribeLiveSessions streams SessionSummary change events in real time.
  rpc SubscribeLiveSessions(WatchLiveSessionsRequest) returns (stream WatchLiveSessionsEvent);
}

// ============================================================================
// TimedbQuery message types
// ============================================================================

message TimedbQueryRequest {
  // sql is a ClickHouse SQL query against the timeseries projection tables.
  string         sql        = 1;
  // time_range is required — unbounded timeseries scans are disallowed.
  EventTimeRange time_range = 2;
  // batch_size overrides the node default for rows per response message. 0 = default.
  int32          batch_size = 3;
  string trace_id = 200;
  bool noop = 201;
}

message TimedbQueryResponse {
  // rows_json is one batch of query results as a JSON array.
  string rows_json  = 1;
  // is_eos is true on the final message of the stream.
  bool   is_eos     = 2;
  // total_rows is the total result rows across all batches (set on first response).
  int64  total_rows = 3;
  // elapsed_ms is the server-side ClickHouse query latency in milliseconds.
  int64  elapsed_ms = 4;
  string trace_id = 200;
  bool noop = 201;
}

// ============================================================================
// TimedbQuery — S2S timeseries query interface, hosted by timedb
// ============================================================================

service TimedbQuery {

  // ExecuteQuery executes a ClickHouse SQL query against the timeseries projection tables.
  // Results are delivered in batches; the final message has is_eos = true.
  // time_range is required — unbounded scans are not permitted.
  rpc ExecuteQuery(TimedbQueryRequest) returns (stream TimedbQueryResponse);
}


language: go
# compiler floor: the 2.6 line; tacplus.lock pins its release and build image (tacplus#193).
tacplus: "2.6"
# pkg is derived from go.mod (github.com/tacplus-dev/kmaker: the org name has a hyphen,
# which pkg cannot carry). A derived Go package is <module>/tacplus, so the output is "tacplus" (#3).
output-dir: tacplus
output-name: tacplus
src: proto
